name: build

on:
  push:
    branches: [main]
    # This project versions as MAJOR.MINOR (v1.00), not three-part semver --
    # 'v*.*.*' silently matched nothing and the v1.00 tag produced no run at
    # all, so no release was published. Match any v-tag.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Two lanes. The fast lane (lint, panels, host-tests, secrets) always runs
  # and costs ~20 s all told. The heavy lane -- six ESP-IDF builds at 3-5
  # minutes each -- is skipped when a push touches only documentation.
  #
  # Measured before writing this: Lint is 0.2 min, the builds are 2.9-4.8 min
  # each. Around 40% of non-merge commits on main are .md-only, because the
  # project's workflow deliberately exempts doc edits from the branch/PR
  # cycle, so they land straight here and used to trigger all six builds.
  #
  # Fails SAFE: anything it cannot classify builds everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail

          # A tag build must produce artifacts for the release job, and a
          # change to the workflow itself must be exercised -- neither is
          # ever "docs-only", whatever the diff says.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag push -- building everything"
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # A merge commit pushed to main is a PR landing, and that PR's own
          # CI already built this tree minutes ago. Rebuilding it is ~24 min
          # of runner time to reproduce a known result.
          #
          # Narrow on purpose:
          #   - push events only; a pull_request build is the one that
          #     matters and never reaches this branch.
          #   - tags already returned above, so a release still builds.
          #   - a DIRECT push to main (the workflow allows small corrections
          #     without a PR) has one parent, so it still builds. Only
          #     merges are skipped.
          #
          # Accepted gap: if main advanced while the PR was open, the merge
          # tree differs from what the PR built. Single maintainer, short
          # branches -- and the fast lane (lint, registry, host tests,
          # secrets) still runs on every merge regardless. Revisit if this
          # repo ever gets concurrent contributors.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            parents="$(git rev-list --parents -n1 "$GITHUB_SHA" | wc -w)"
            if [[ "$parents" -ge 3 ]]; then
              echo "merge commit ($((parents - 1)) parents) -- already built by its PR; skipping the firmware builds"
              echo "code=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          # Zero SHA (new branch), missing, or an object we do not have:
          # we cannot know what changed, so assume code.
          if [[ -z "${base:-}" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable diff base ($base) -- building everything"
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          # Everything that is NOT a doc. Note .github/ counts as code.
          if echo "$changed" | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "=> code changed; running the firmware builds"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "=> documentation only; skipping the firmware builds"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Ruff (tools/*.py)
        run: |
          python -m pip install --quiet ruff
          ruff check tools/
      # Static analysis of the C sources actually shared across panels.
      # PANEL_CONFIG_HEADER is normally injected by CMakeLists.txt from
      # -DPANEL=<name>; pinned to one real panel header here so cppcheck can
      # resolve main/panel_config.h's #include.
      #
      # This list is EVERY component. It used to be seven of them, which left
      # the whole BLE stack and ws_io_expander unanalysed -- and
      # ws_io_expander is the driver behind the issue #73 CAN outage. The
      # faults these components produce are silent ones (a dead bus, a stuck
      # mux, a swallowed write), which is the class that costs the most to
      # diagnose from symptoms, so they are the last place to skip a checker.
      # Add new components here when you add them.
      - name: cppcheck (main/, components/)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cppcheck
          cppcheck --enable=warning,performance,portability --error-exitcode=1 \
            --suppress=missingIncludeSystem --inline-suppr \
            -I panels -DPANEL_CONFIG_HEADER='"mid_coach.h"' \
            main components/rvc_protocol components/ui_common \
            components/board components/ch422g \
            components/espnow_link components/valve_control \
            components/ble_host components/easytouch \
            components/hughes_watchdog components/jbd_bms \
            components/renogy_solar components/ws_io_expander

  # The coach's real hardware identity -- device MACs, ESP-NOW PMK/LMK, BLE
  # peer addresses, the EasyTouch account password -- lives only in the
  # gitignored DEVICES.local.md and each build_<panel>/sdkconfig. Committed
  # files name devices by role.
  #
  # That rule was previously enforced by remembering to run this grep by
  # hand before a docs commit. A credential reaching a public repo is not
  # undoable by a later commit, so it is checked mechanically instead.
  # ⚠️ This job prevents the NEXT leak. It cannot undo issue #86, where the
  # ESP-NOW keys actually in use are committed Kconfig defaults in a public
  # repo -- those are allow-listed below precisely so this job does not fail
  # red on a known, tracked problem. Remove the allow-list entry when #86 is
  # resolved and the real keys move to build_<panel>/sdkconfig.
  secrets:
    name: No credentials in tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: MAC addresses
        run: |
          # Placeholders are legitimate: sdkconfig.defaults and the simulator
          # stubs ship AA:BB:CC:DD:EE:xx, and configured_mac() treats them as
          # "unconfigured" so a link simply never comes up.
          if git grep -nEi '([0-9a-f]{2}:){5}[0-9a-f]{2}' \
               | grep -viE 'AA:BB:CC:DD:EE:[0-9A-F]{2}|00:00:00:00:00:00' \
               > /tmp/hits; then
            echo "::error::MAC-shaped strings found in tracked files."
            echo "Device MACs belong in DEVICES.local.md (gitignored) or"
            echo "build_<panel>/sdkconfig -- see docs/FLASHING.md."
            cat /tmp/hits
            exit 1
          fi
          echo "OK: no real MACs in tracked files."

      - name: Files that carry secrets by design must stay untracked
        run: |
          # A tracked sdkconfig or *.local.md is a leak regardless of what is
          # in it today, because these are the files the project deliberately
          # puts real keys, MACs and the EasyTouch password into.
          # sdkconfig.defaults / sdkconfig.<panel>.defaults are the committed
          # templates and are fine; a bare `sdkconfig` is not.
          if git ls-files | grep -nE '(^|/)sdkconfig$|\.local\.md$' > /tmp/hits; then
            echo "::error::A secret-bearing file is tracked."
            cat /tmp/hits
            exit 1
          fi
          echo "OK: no sdkconfig or *.local.md is tracked."

      - name: Project credentials
        run: |
          # The EasyTouch account password must never appear with a value.
          if git grep -nE 'CONFIG_FIREFLY_EASYTOUCH_PASSWORD[[:space:]]*=?[[:space:]]*"[^"]+"' > /tmp/hits; then
            echo "::error::EasyTouch account password found in a tracked file."
            cat /tmp/hits
            exit 1
          fi

          # ESP-NOW keys. The two firefly-*-0001 strings are the currently
          # deployed defaults and are the subject of issue #86 -- allow-listed
          # so this job reports new leaks rather than re-reporting a known
          # one. Any OTHER key value here means a real key was committed.
          if git grep -nEi '(PMK|LMK)[^\n]*"[^"]{8,}"' \
               | grep -viE 'firefly-(pmk|lmk)-0001|firefly-valve-lmk-01|CHANGE THIS' \
               > /tmp/hits; then
            echo "::error::An ESP-NOW key value appears in a tracked file."
            echo "Keys belong in build_<panel>/sdkconfig -- see issue #86."
            cat /tmp/hits
            exit 1
          fi
          echo "OK: no project credentials in tracked files."

      - name: Generic credential shapes
        run: |
          # Cheap, high-signal patterns. Deliberately narrow: this repo has no
          # cloud services, so a hit here is almost certainly a real mistake.
          #
          # "BEGIN [A-Z ]*PRIVATE KEY" already covers the OpenSSH, RSA and EC
          # header variants -- an explicit "-----BEGIN OPENSSH" alternative
          # was removed because the pattern string then matched ITSELF in this
          # file and failed the job on its own source. Keep every alternative
          # here anchored on a character class, never a bare literal header.
          pat='BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}'
          if git grep -nE "$pat" > /tmp/hits; then
            echo "::error::A credential-shaped string was found."
            cat /tmp/hits
            exit 1
          fi
          echo "OK: no generic credential shapes."

  panels:
    name: Panel registry
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.panels }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      # Fails on duplicate PANEL_INDEX (= duplicate RV-C source address) or a
      # panel header missing from panels/REGISTRY.md.
      - name: Validate panel indices and registry
        run: python tools/check_panels.py
      # Emits the panel list so the firmware job below builds every panel
      # automatically — adding a panel needs no change to this workflow.
      - id: list
        run: echo "panels=$(python tools/check_panels.py --matrix)" >> "$GITHUB_OUTPUT"

  host-tests:
    name: Host-testable component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile and run rvc_protocol tests
        working-directory: components/rvc_protocol/host_test
        run: |
          gcc -Wall -Wextra -Werror -I../include ../rvc_protocol.c test_rvc.c -o test_rvc
          ./test_rvc
      - name: Compile and run jbd_bms tests
        working-directory: components/jbd_bms/host_test
        run: |
          gcc -Wall -Wextra -Werror -I../include ../jbd_bms_protocol.c test_jbd_bms.c -lm -o test_jbd_bms
          ./test_jbd_bms
      - name: Compile and run hughes_watchdog tests
        working-directory: components/hughes_watchdog/host_test
        run: |
          gcc -Wall -Wextra -Werror -I../include ../hughes_wd_protocol.c test_hughes_wd.c -lm -o test_hughes_wd
          ./test_hughes_wd
      - name: Compile and run renogy_solar tests
        working-directory: components/renogy_solar/host_test
        run: |
          gcc -Wall -Wextra -Werror -I../include ../renogy_solar_protocol.c test_renogy_solar.c -lm -o test_renogy_solar
          ./test_renogy_solar
      - name: Compile and run valve_control tests
        working-directory: components/valve_control/host_test
        run: |
          gcc -Wall -Wextra -Werror -I../include ../valve_control.c test_valve_control.c -o test_valve_control
          ./test_valve_control
      - name: Compile and run easytouch tests
        working-directory: components/easytouch/host_test
        run: |
          gcc -Wall -Wextra -Werror -I../include ../easytouch_protocol.c test_easytouch.c -o test_easytouch
          ./test_easytouch

  # The basement BLE proxy is a separate project on a different chip
  # (classic ESP32, not the panels' S3), so the panel matrix above cannot
  # cover it — without this job it would build on nobody's machine but the
  # author's.
  proxy:
    name: Build ble proxy
    needs: [changes, lint, host-tests]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: idf.py build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32
          command: idf.py -C proxy -B proxy/build build

  # Basement dump-valve controller — also a separate project (see
  # valves/CMakeLists.txt), but on the panels' own ESP32-S3 target rather
  # than proxy's classic ESP32.
  valves:
    name: Build valve node
    needs: [changes, lint, host-tests]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: idf.py build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          command: idf.py -C valves -B valves/build build

  firmware:
    name: Build ${{ matrix.panel }}
    needs: [changes, lint, panels, host-tests]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        panel: ${{ fromJson(needs.panels.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: idf.py build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          command: idf.py -B build_${{ matrix.panel }} -DPANEL=${{ matrix.panel }} build
      # Lets you flash a panel from a machine without ESP-IDF installed:
      # download the artifact and use the esptool command in docs/FLASHING.md.
      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.panel }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build_${{ matrix.panel }}/firefly_touch.bin
            build_${{ matrix.panel }}/bootloader/bootloader.bin
            build_${{ matrix.panel }}/partition_table/partition-table.bin
            build_${{ matrix.panel }}/flash_args

  # "Deploy" for wall-mounted firmware means publishing flashable binaries,
  # not pushing to a server. Runs only on a version tag (e.g. `v1.2.0`), once
  # every panel above has built successfully, and attaches each panel's
  # binaries to a GitHub Release for manual USB flashing per docs/FLASHING.md
  # (no OTA — updates are USB-only by design, see CLAUDE.md).
  release:
    name: Publish release
    needs: firmware
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: firmware-*
          path: artifacts

      - name: Zip per-panel firmware bundles
        run: |
          mkdir -p dist
          for dir in artifacts/firmware-*; do
            panel="$(basename "$dir" | sed 's/^firmware-//')"
            (cd "$dir" && zip -r "$GITHUB_WORKSPACE/dist/${panel}-${{ github.ref_name }}.zip" .)
          done

      # Uses the gh CLI (preinstalled on the runner) rather than a
      # third-party action. softprops/action-gh-release@v2 pins Node 20,
      # which the runner force-migrates to Node 24 -- the one annotation on
      # the otherwise-clean v1.00 release run. gh has no Node runtime to go
      # stale, and this drops a third-party dependency from the one job that
      # holds `contents: write`.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ github.ref_name }}" \
            --generate-notes
