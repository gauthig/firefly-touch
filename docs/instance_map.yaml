# RV-C DC_DIMMER instance map for the 2019 Entegra Aspire 44W.
#
# Source: factory Entegra switch-panel wiring/label diagram (5 wall panels +
# 2 Entegra-provided bath fixtures), transcribed 2026-08-13. This is the
# factory legend, NOT a sniffer capture -- treat every entry as "verified: false"
# until confirmed by watching real DC_DIMMER_STATUS_3 frames in sniffer mode
# (see CLAUDE.md -> Build/flash/monitor -> Sniffer mode). Entries already
# exercised in firmware (panels/living_room.h, panels/ent_center.h) are
# marked verified: true -- they've moved a real load on the coach.
#
# Use `loads` as the lookup table when assigning buttons on a new panel
# (CAN-connected or ESP-NOW remote): pick instance number(s) + type.
# `switch_panels` records the original factory layout for reference only.
#
# type values:
#   dimmer - DC_DIMMER_COMMAND_2/STATUS_3, supports tap-toggle + hold-to-ramp
#   switch - same DGN, driven on/off only (no ramp) in current firmware
#   local  - not RV-C at all; stays on the panel's own MCU (e.g. LCD backlight)
#   master - factory "LIGHT MASTER" all-panel on/off; DGN not yet identified
#
# instances: a list. Buttons with more than one instance must send the
# command once per instance (fire-and-forget to each, same as the existing
# multi-instance buttons in panels/living_room.h e.g. SIDE CEILING {30,31}).
#
# `tank_sensors` (added 2026-08-15): a SEPARATE DGN from the dimmer loads
# above -- TANK_STATUS (0x1FFB7), read-only, broadcast by the coach's Garnet
# SeeLevel II 709-RVC tank monitor. NOT YET DISPLAYABLE on any panel:
# panel_btn_def_t / ui_dimmer_button only understand DC_DIMMER_COMMAND_2/
# STATUS_3 (on-off + ramp) today. Wiring a percentage-gauge readout onto a
# panel needs a new button/widget type (e.g. PANEL_BTN_TANK_LEVEL) plus a
# TANK_STATUS decoder in twai_rx_task and a place in state_manager to hold
# it -- none of that exists yet. This section exists so the protocol
# details are captured for when that feature gets built; it is a read
# reference, not something panels/*.h can consume today.

