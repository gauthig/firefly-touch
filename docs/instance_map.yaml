# Garnet SeeLevel II 709-RVC tank monitor -- 3 sensors on this coach's bus
# (Fresh, Grey, Black). Read-only TANK_STATUS broadcasts, NOT the
# DC_DIMMER DGN the `loads` table above uses. See the header comment above
# `tank_sensors` (top of file) for why no panel can display these yet.
#
# Byte layout and instance mapping BUS-CONFIRMED 2026-08-15 via sniffer
# mode on this coach (source addr 0x48 = 0xAF... wait, see note below) --
# no longer "public references only". Originally researched from:
#   - Garnet 709-RVC product docs (garnetinstruments.com)
#   - Victron GX RV-C support notes (victronenergy.com) and community archive
#   - linuxkidd/coachproxy-os `rvc-spec.yml` (github.com/linuxkidd/
#     coachproxy-os) -- same open-source RV-C spec family already used to
#     verify this project's DC_DIMMER command codes (see CLAUDE.md's RV-C
#     protocol section)
# ...then corrected against real captured frames after the firmware
# initially decoded all three tanks as 0%. The bug: `percent = relative_level
# / resolution` (as the public sources described it) integer-truncates to 0
# whenever relative_level < resolution, which is ALWAYS true here --
# resolution is this SeeLevel unit's total capacitive-sensor-segment count
# for that tank's strip (it differs per instance: 32 vs 28 on this coach),
# not a percent-per-count divisor. Correct formula, confirmed against three
# real captured frames (also used as host_test/test_rvc.c regression
# vectors): percent = relative_level * 100 / resolution.
# The factory LIGHT MASTER rocker, BUS-CONFIRMED 2026-08-28 via sniffer mode
# on mid_coach (COM16). This closes the long-standing "capture the rocker
# before assuming it has no frame" TODO -- it does have one, and it is a DGN
# we already speak.
light_master:
  name: LIGHT MASTER rocker
  dgn: "0x1FEDB (DC_DIMMER_COMMAND_2 -- the SAME DGN our panels send)"
  source_address: "0x9F (a factory switch panel)"
  verified: 2026-08-28
  addressing: >
    instance = 0xFF (all instances), with the GROUP byte selecting which
    set of loads. The rocker sends SIX frames per press, one for each of
    groups 0x84..0x89. There is no single all-lights frame.
  frames:
    "off":
      example: "FF 84 00 06 FF 00 FF FF"
      repeated_for_groups: ["0x84", "0x85", "0x86", "0x87", "0x88", "0x89"]
      decode:
        instance: "0xFF = all"
        group: "0x84..0x89"
        level: "0x00"
        command: "0x06 = RVC_DIMMER_CMD_MEMORY_OFF (already in our enum) --
          off, but REMEMBERING each load's level"
        interlock: "0x00 (matches what we already send)"
    "on":
      example: "FF 84 FB 00 FF 00 FF FF"
      repeated_for_groups: ["0x84", "0x85", "0x86", "0x87", "0x88", "0x89"]
      decode:
        instance: "0xFF = all"
        group: "0x84..0x89"
        level: "0xFB = 251, the RV-C 'restore remembered level' value --
          NOT a brightness (the normal range is 0..200)"
        command: "0x00 = RVC_DIMMER_CMD_SET_LEVEL"
        interlock: "0x00"
  acknowledgement:
    dgn: "0x0E8FF"
    example: "00 FF FF FF FF DB FE 01 (from the G6 at sa=0x8F)"
    notes: >
      This resolves the "proprietary DGN 0x0E8FF, unidentified" note that
      sat in the project docs for a long time. It is NOT proprietary: it is
      J1939 PGN 59392 (0xE800), the standard Acknowledgment PGN. Byte 0
      0x00 = positive ACK; bytes 5-7 are the acknowledged DGN little-endian
      (DB FE 01 -> 0x1FEDB). The G6 sent exactly one per command frame.
  observed_effect: >
    MEMORY-RESTORE SEMANTICS ARE PROVEN, not inferred. The OFF burst drove
    24 instances (0x0D-0x24 = 13-36) to level 0, each DC_DIMMER_STATUS_3
    echoing command 0x06. The ON burst brought back EXACTLY FOUR --
    instances 25, 26, 27 and 34 at 0xC8 (100%) -- which are precisely the
    four observed lit at 0xC8 earlier in the same capture. Loads that were
    already off stayed off.
  implemented_by: >
    main_cabinet's MASTER button replays exactly these frames as of
    2026-08-28 (coach-verified). It previously synthesised the action -- a
    fixed 100% scene for on, a state-manager sweep for off -- which lit
    loads that had been off and could not reach a load quiet since boot.
    Groups live in PANEL_MASTER_GROUPS (main/panel_config.h).
    WATCH OUT: level 251 is a sentinel, and the encoder's brightness clamp
    ate it on the first attempt, turning master-on into "set everything to
    100%" -- indistinguishable from the old scene behaviour. Guarded now by
    a byte-for-byte host test against the frames above.
  caveat: >
    The group list 0x84-0x89 is only known to be COMPLETE in the sense that
    it is what this rocker sends. A load in some other group would not be
    covered by replaying these six frames. Confirm before deleting the
    state-sweep fallback.

tank_dgn:
  name: TANK_STATUS
  dgn: "0x1FFB7"
  direction: RX (broadcast by the SeeLevel unit, panels never send it)
  source_address_default: "0x48 (72) per public docs; this coach's unit
    sniffed transmitting from 0xAF -- see tank_sensors notes below"
  fields:
    - byte: 0
      name: instance
      notes: which tank -- see tank_sensors below for the values seen on
        this coach's 3-sensor kit
    - byte: 1
      name: relative_level
      notes: count of "wet" capacitive sensor segments (bus-confirmed
        2026-08-15)
    - byte: 2
      name: resolution
      notes: total sensor segment count for this tank's strip -- varies per
        instance (32 for fresh, 28 for black/gray on this coach), NOT a
        fixed protocol constant. percent = relative_level * 100 / resolution
        (bus-confirmed 2026-08-15, see header note above)
    - byte: 3-4
      name: absolute_level
      unit: Liter (uint16, seen as 0xFFFF/not-available on this coach)
    - byte: 5-6
      name: tank_size
      unit: Liter (uint16, seen as 0xFFFF/not-available on this coach)

# Displayed on panels/mid_coach.h ("MID COACH") screen 2 as of GitHub
# issue #5. verified: true below means the instance number + decode
# formula are bus-confirmed correct (sniffer capture 2026-08-15) -- NOT
# that the displayed percent exactly matches the SeeLevel unit's own
# front-panel digits. It doesn't, by design of the hardware:
#
#   Compared 2026-08-15 against the physical SeeLevel II display:
#     Fresh: panel 12% vs SeeLevel  9%  (+3)
#     Grey:  panel 67% vs SeeLevel 68%  (-1, within rounding)
#     Black: panel 10% vs SeeLevel 14%  (-4)
#
#   Grey is an effective match; Fresh and Black are off by a few points.
#   Likely cause: the SeeLevel's advertised feature is per-tank shape
#   COMPENSATION -- correcting the raw "N of M capacitive segments wet"
#   ratio for non-rectangular tank geometry before showing a number on its
#   own display. TANK_STATUS on the bus appears to carry the raw,
#   uncompensated segment ratio (relative_level/resolution) -- the
#   compensation curve itself isn't exposed over RV-C and would need
#   extensive additional sampling across each tank's full range to even
#   attempt reverse-engineering, with no guarantee of matching Garnet's
#   proprietary firmware. Accepted as good enough 2026-08-15 -- the panel
#   reading is directionally correct and close, just not pixel-exact to
#   the SeeLevel's own compensated display.
tank_sensors:
  - name: Fresh Tank
    instance: 0
    dgn: "0x1FFB7 (TANK_STATUS)"
    verified: true
    notes: Bus-confirmed 2026-08-15 via sniffer capture on mid_coach
      (source addr 0xAF). Instance 0 = fresh, matching RV-C convention.
      Displayed percent runs a few points off the SeeLevel's own display
      -- see the tank-shape-compensation note above this block.

  - name: Black Tank
    instance: 1
    dgn: "0x1FFB7 (TANK_STATUS)"
    verified: true
    notes: >
      Bus-confirmed 2026-08-15 via sniffer capture: instance 1 = black,
      matching Garnet/Victron docs and coachproxy-os's rvc-spec.yml (the
      community-forum claim of the reverse ordering was wrong). Displayed
      percent runs a few points off the SeeLevel's own display -- see the
      tank-shape-compensation note above this block.

  - name: Grey Tank
    instance: 2
    dgn: "0x1FFB7 (TANK_STATUS)"
    verified: true
    notes: >
      Bus-confirmed 2026-08-15 via sniffer capture: instance 2 = gray.
      Displayed percent (67%) essentially matches the SeeLevel's own
      display (68%) -- the closest of the three tanks, consistent with
      grey tanks often being closer to a simple rectangular shape (see the
      tank-shape-compensation note above this block).

