<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" aria-label="2N3904 pinout and point-to-point wiring for the DrainMaster position-sense circuit, grey valve DI1 shown, no bus bar or breadboard required.">
<rect x="0" y="0" width="1000" height="840" fill="#ffffff"/>

<text x="30" y="30" font-family="IBM Plex Sans Condensed, sans-serif" font-size="15" font-weight="700" fill="#14181d">2N3904 sense transistor — pinout + point-to-point wiring</text>
<text x="30" y="48" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#5a6672">Grey valve / DI1 shown — black valve is identical on Q2, R3, R4, C2, DI2</text>

<!-- ===================== SECTION 1: PINOUT ===================== -->
<text x="30" y="66" font-family="IBM Plex Sans Condensed, sans-serif" font-size="14" font-weight="700" fill="#c0392b">1. 2N3904 pinout (TO-92) — not the same leg order as the 2N7000 MOSFET this doc was written for</text>

<!-- package body -->
<rect x="150" y="90" width="180" height="110" rx="16" fill="#f2f5f7" stroke="#14181d" stroke-width="2"/>
<line x1="150" y1="90" x2="150" y2="200" stroke="#c0392b" stroke-width="5"/>
<line x1="172" y1="84" x2="153" y2="94" stroke="#c0392b" stroke-width="1.5"/>
<text x="30" y="80" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="700" fill="#c0392b">FLAT FACE (printed side) — highlighted red</text>

<text x="240" y="148" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="18" font-weight="700" fill="#14181d">2N3904</text>
<text x="240" y="168" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#5a6672">(TO-92)</text>

<!-- legs -->
<line x1="190" y1="200" x2="190" y2="260" stroke="#14181d" stroke-width="2"/>
<line x1="240" y1="200" x2="240" y2="260" stroke="#14181d" stroke-width="2"/>
<line x1="290" y1="200" x2="290" y2="260" stroke="#14181d" stroke-width="2"/>

<text x="190" y="278" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700" fill="#14181d">E</text>
<text x="240" y="278" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700" fill="#14181d">B</text>
<text x="290" y="278" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700" fill="#14181d">C</text>

<text x="190" y="294" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9.5" fill="#5a6672">(emitter)</text>
<text x="240" y="294" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9.5" fill="#5a6672">(base)</text>
<text x="290" y="294" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9.5" fill="#5a6672">(collector)</text>

<text x="190" y="313" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">&#8594; GND</text>
<text x="190" y="327" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#5a6672">(Source role)</text>
<text x="240" y="313" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="700" fill="#1565c0">&#8594; sense node</text>
<text x="240" y="327" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#5a6672">(Gate role)</text>
<text x="290" y="313" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="700" fill="#1565c0">&#8594; DI pin</text>
<text x="290" y="327" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#5a6672">(Drain role)</text>

<text x="420" y="118" font-family="IBM Plex Sans Condensed, sans-serif" font-size="12.5" fill="#14181d">Hold it with the flat printed face toward you,</text>
<text x="420" y="138" font-family="IBM Plex Sans Condensed, sans-serif" font-size="12.5" fill="#14181d">pins hanging down. Left to right:</text>
<text x="420" y="164" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="700" fill="#14181d">E &#183; B &#183; C</text>

<rect x="420" y="184" width="420" height="74" rx="6" fill="#fff4f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="432" y="204" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="700" fill="#c0392b">&#9888; Do not copy the 2N7000's S-G-D leg order.</text>
<text x="432" y="220" font-family="IBM Plex Sans, sans-serif" font-size="10.5" fill="#14181d">Map by FUNCTION instead: Gate&#8594;Base,</text>
<text x="432" y="236" font-family="IBM Plex Sans, sans-serif" font-size="10.5" fill="#14181d">Drain&#8594;Collector, Source&#8594;Emitter.</text>
<text x="432" y="252" font-family="IBM Plex Sans, sans-serif" font-size="10.5" fill="#14181d">Check YOUR part's datasheet — some (e.g. 2SC1815) are E-C-B.</text>

<!-- ===================== SECTION 2 ===================== -->
<line x1="30" y1="345" x2="970" y2="345" stroke="#d8dde1" stroke-width="1"/>
<text x="30" y="372" font-family="IBM Plex Sans Condensed, sans-serif" font-size="14" font-weight="700" fill="#14181d">2. Point-to-point wiring — no bus bar or breadboard: twist bare leads together, solder solid, then heat-shrink</text>

<!-- pigtail GREEN in -->
<text x="40" y="428" font-family="IBM Plex Sans Condensed, sans-serif" font-size="11" font-weight="700" fill="#2e7d32">GREEN (MAG signal, from pigtail)</text>
<line x1="40" y1="460" x2="140" y2="460" stroke="#2e7d32" stroke-width="2.5"/>

<!-- R1 -->
<rect x="140" y="445" width="70" height="30" rx="3" fill="#ffffff" stroke="#14181d" stroke-width="1.8"/>
<text x="175" y="458" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="700" fill="#14181d">R1</text>
<text x="175" y="470" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#5a6672">100k&#8486;</text>
<line x1="210" y1="460" x2="300" y2="460" stroke="#1565c0" stroke-width="2.5"/>

<!-- Junction A -->
<circle cx="300" cy="460" r="12" fill="none" stroke="#9aa1a8" stroke-width="1.5" stroke-dasharray="3,3"/>
<circle cx="300" cy="460" r="5" fill="#14181d"/>
<text x="300" y="440" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="700" fill="#14181d">J1</text>

<!-- Junction A -> R2 -->
<line x1="300" y1="460" x2="300" y2="500" stroke="#1565c0" stroke-width="2.5"/>
<rect x="265" y="500" width="70" height="34" rx="3" fill="#ffffff" stroke="#14181d" stroke-width="1.8"/>
<text x="300" y="514" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="700" fill="#14181d">R2</text>
<text x="300" y="527" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#5a6672">100k&#8486;</text>

<!-- Junction A -> C1 (offset right) -->
<line x1="300" y1="460" x2="390" y2="460" stroke="#1565c0" stroke-width="2.5"/>
<line x1="390" y1="460" x2="390" y2="500" stroke="#1565c0" stroke-width="2.5"/>
<rect x="355" y="500" width="70" height="34" rx="3" fill="#ffffff" stroke="#14181d" stroke-width="1.8"/>
<text x="390" y="514" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="700" fill="#14181d">C1</text>
<text x="390" y="527" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#5a6672">100nF</text>
<text x="390" y="490" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="8.5" fill="#9aa1a8">(parallel with R2)</text>

<!-- Junction A -> Base (offset down slightly to avoid overlapping the C1 leg) -->
<line x1="300" y1="460" x2="300" y2="471" stroke="#1565c0" stroke-width="2.5"/>
<line x1="300" y1="471" x2="520" y2="471" stroke="#1565c0" stroke-width="2.5"/>
<line x1="520" y1="471" x2="520" y2="480" stroke="#1565c0" stroke-width="2.5"/>
<text x="503" y="465" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="700" fill="#1565c0">B</text>

<!-- Transistor Q1 -->
<rect x="470" y="480" width="120" height="70" rx="4" fill="#f2f5f7" stroke="#14181d" stroke-width="1.8"/>
<text x="530" y="510" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="13" font-weight="700" fill="#14181d">Q1</text>
<text x="530" y="528" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#5a6672">2N3904</text>

<!-- Q1 emitter -> down to Junction B -->
<line x1="490" y1="550" x2="490" y2="600" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="490" y1="600" x2="300" y2="600" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="472" y="565" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="700" fill="#1a1a1a">E</text>

<!-- Q1 collector -> DI1 -->
<line x1="590" y1="515" x2="680" y2="515" stroke="#1565c0" stroke-width="2.5"/>
<text x="600" y="508" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="700" fill="#1565c0">C</text>
<text x="700" y="486" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="8.5" fill="#9aa1a8">(black valve: DI2 / GPIO5, same circuit)</text>
<rect x="680" y="495" width="120" height="40" rx="3" fill="#eef3fb" stroke="#1565c0" stroke-width="1.8"/>
<text x="740" y="513" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="13" font-weight="700" fill="#1565c0">DI1</text>
<text x="740" y="528" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#5a6672">GPIO4, grey</text>

<!-- R2 -> Junction B -->
<line x1="300" y1="534" x2="300" y2="600" stroke="#1a1a1a" stroke-width="2.5"/>

<!-- C1 -> Junction B -->
<line x1="390" y1="534" x2="390" y2="600" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="390" y1="600" x2="300" y2="600" stroke="#1a1a1a" stroke-width="2.5"/>

<!-- Junction B -->
<circle cx="300" cy="600" r="12" fill="none" stroke="#9aa1a8" stroke-width="1.5" stroke-dasharray="3,3"/>
<circle cx="300" cy="600" r="5" fill="#14181d"/>
<text x="300" y="580" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="700" fill="#14181d">J2</text>

<!-- Junction B -> GND bus -->
<line x1="300" y1="600" x2="300" y2="660" stroke="#1a1a1a" stroke-width="2.5"/>
<rect x="200" y="660" width="200" height="44" rx="3" fill="#f2f5f7" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="300" y="680" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a">to board GND bus</text>
<text x="300" y="695" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9.5" fill="#5a6672">(DGND / WAGO G1)</text>

<!-- ===================== LEGEND ===================== -->
<rect x="30" y="730" width="940" height="92" rx="6" fill="#f9fafb" stroke="#d8dde1" stroke-width="1"/>

<line x1="46" y1="752" x2="76" y2="752" stroke="#2e7d32" stroke-width="3"/>
<text x="86" y="756" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#14181d">GREEN — MAG signal from the pigtail</text>

<line x1="46" y1="774" x2="76" y2="774" stroke="#1565c0" stroke-width="3"/>
<text x="86" y="778" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#14181d">BLUE — the divider-tap node and Q1's collector-to-DI wire</text>

<line x1="46" y1="796" x2="76" y2="796" stroke="#1a1a1a" stroke-width="3"/>
<text x="86" y="800" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#14181d">BLACK — ground</text>

<circle cx="530" cy="750" r="8" fill="none" stroke="#9aa1a8" stroke-width="1.5" stroke-dasharray="3,3"/>
<circle cx="530" cy="750" r="3.5" fill="#14181d"/>
<text x="548" y="748" font-family="IBM Plex Sans, sans-serif" font-size="11" font-weight="700" fill="#14181d">J1 / J2 — twisted-wire splice</text>
<text x="548" y="765" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#5a6672">Strip, twist the bare ends tightly, solder solid. Slide heat-shrink</text>
<text x="548" y="780" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#5a6672">on BEFORE twisting, shrink it after. This is your bus-bar substitute —</text>
<text x="548" y="795" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#5a6672">J1 has 4 leads meeting (R1, R2, C1, base); J2 has 4 (R2, C1, emitter, GND-out).</text>

</svg>
