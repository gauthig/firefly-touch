<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-label="H-bridge detail for the grey valve. CH1 connects motor white to the plus-12 bus and CH2 connects it to ground; CH3 and CH4 do the same for motor red. All NC contacts stay empty so releasing every relay leaves both motor wires floating."><rect x="0" y="0" width="880" height="500" fill="#ffffff"/><line x1="80" y1="60" x2="800" y2="60" stroke="#c0392b" stroke-width="3.5"/><text x="80" y="46" font-family="IBM Plex Sans Condensed, sans-serif" font-size="13" font-weight="700" fill="#c0392b">+12 V BUS — from P1</text><line x1="80" y1="440" x2="800" y2="440" stroke="#1a1a1a" stroke-width="3.5"/><text x="80" y="466" font-family="IBM Plex Sans Condensed, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">GND BUS — from G1</text><line x1="150" y1="60" x2="150" y2="100" stroke="#c0392b" stroke-width="2"/><rect x="100" y="100" width="100" height="80" rx="3" fill="#f2f5f7" stroke="#14181d" stroke-width="1.8"/><text x="150" y="130" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="16" font-weight="700" fill="#14181d">CH1</text><text x="150" y="149" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#5a6672">NO + COM</text><text x="150" y="166" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#b6bfc7">NC empty ✕</text><line x1="150" y1="180" x2="150" y2="300" stroke="#9aa1a8" stroke-width="2"/><rect x="100" y="320" width="100" height="80" rx="3" fill="#f2f5f7" stroke="#14181d" stroke-width="1.8"/><text x="150" y="350" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="16" font-weight="700" fill="#14181d">CH2</text><text x="150" y="369" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#5a6672">NO + COM</text><text x="150" y="386" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#b6bfc7">NC empty ✕</text><line x1="150" y1="400" x2="150" y2="440" stroke="#1a1a1a" stroke-width="2"/><line x1="730" y1="60" x2="730" y2="100" stroke="#c0392b" stroke-width="2"/><rect x="680" y="100" width="100" height="80" rx="3" fill="#f2f5f7" stroke="#14181d" stroke-width="1.8"/><text x="730" y="130" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="16" font-weight="700" fill="#14181d">CH3</text><text x="730" y="149" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#5a6672">NO + COM</text><text x="730" y="166" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#b6bfc7">NC empty ✕</text><line x1="730" y1="180" x2="730" y2="300" stroke="#c0392b" stroke-width="2"/><rect x="680" y="320" width="100" height="80" rx="3" fill="#f2f5f7" stroke="#14181d" stroke-width="1.8"/><text x="730" y="350" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="16" font-weight="700" fill="#14181d">CH4</text><text x="730" y="369" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#5a6672">NO + COM</text><text x="730" y="386" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#b6bfc7">NC empty ✕</text><line x1="730" y1="400" x2="730" y2="440" stroke="#1a1a1a" stroke-width="2"/><circle cx="150" cy="225" r="3.6" fill="#14181d"/><line x1="150" y1="225" x2="380" y2="225" stroke="#9aa1a8" stroke-width="2.5"/><text x="268" y="216" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="12.5" font-weight="700" fill="#6a7178">WHITE (motor)</text><line x1="150" y1="300" x2="150" y2="320" stroke="#9aa1a8" stroke-width="2"/><rect x="380" y="190" width="140" height="90" rx="4" fill="#ffffff" stroke="#14181d" stroke-width="2"/><circle cx="450" cy="226" r="24" fill="none" stroke="#14181d" stroke-width="1.8"/><text x="450" y="232" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="17" font-weight="700" fill="#14181d">M</text><text x="450" y="268" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#5a6672">valve motor · ~1 A</text><line x1="520" y1="255" x2="730" y2="255" stroke="#c0392b" stroke-width="2.5"/><circle cx="730" cy="255" r="3.6" fill="#14181d"/><text x="625" y="246" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">RED (motor)</text><line x1="730" y1="300" x2="730" y2="320" stroke="#c0392b" stroke-width="2"/></svg>